<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY DOCTOR PRESCRIPTIONS RECORD</title>
<style>
:root{--teal:#0e6674;--teal2:#0a4c57;--mint:#e6f3f4;--line:#cfdde0;--ink:#1c2b2f;--mut:#667a80;--bg:#eef3f4;--warn:#b8431f;--ok:#1d7a4c;--gold:#f2c14e;--rh:28px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.35 "Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Noto Sans Bengali",Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
[hidden]{display:none!important}
button,select,input{font:inherit}
/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:6px 14px;background:linear-gradient(135deg,var(--teal2),var(--teal));color:#fff;border-bottom:3px solid var(--gold)}
.credit{font-family:"Palatino Linotype","Book Antiqua",Georgia,serif;line-height:1.15}
.credit small{display:block;opacity:.8;font-style:italic;font-size:11px}
.credit b{font-size:15px;font-style:italic;color:#ffe29a;border-bottom:1px solid rgba(255,226,154,.6);padding-bottom:1px}
.credit i{display:block;font-size:11px;opacity:.9}
.hdr h1{margin:0;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:clamp(14px,2.4vw,22px);letter-spacing:1.6px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:center}
.hdr h1 .cross{color:var(--gold);font-size:1.1em}
.lock{justify-self:end;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:6px;padding:3px 10px;cursor:pointer;height:26px}
.lock:hover,.lock.open{background:var(--gold);color:#3b2a00;border-color:var(--gold)}
/* toolbar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:6px 14px;background:#fff;border-bottom:1px solid var(--line)}
.pick{display:flex;align-items:center;gap:6px}
.pick label{font-weight:700;color:var(--teal2);text-transform:uppercase;font-size:11px;letter-spacing:.6px}
.pick select{height:30px;min-width:170px;border:2px solid var(--teal);border-radius:6px;padding:0 8px;font-weight:700;color:var(--teal2);background:#f7fdfd}
.pinfo{color:var(--mut);display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--mint);border:1px solid var(--line);border-radius:10px;padding:0 8px;height:20px;line-height:18px;font-size:12px;color:var(--teal2)}
.sp{flex:1}
.btn{height:26px;padding:0 10px;border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:5px;cursor:pointer;white-space:nowrap;font-size:12px;font-weight:600}
.btn:hover:not(:disabled){background:var(--teal2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.o{background:#fff;color:var(--teal2)}
.btn.o:hover:not(:disabled){background:var(--mint)}
.btn.d{border-color:var(--warn);color:var(--warn);background:#fff}
.btn.d:hover:not(:disabled){background:#fbe9e3}
.btn.g{background:var(--gold);border-color:var(--gold);color:#3b2a00}
.admbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:5px 14px;background:#fff8e1;border-bottom:1px solid #ecd48a}
.admbar .tag{font-weight:700;color:#7a5a00;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
/* layout */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,42%) 1fr;gap:10px;padding:10px 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.card>h2{margin:0;padding:0 10px;height:26px;line-height:26px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#fff;background:var(--teal);display:flex;justify-content:space-between;align-items:center}
.scroll{overflow:auto;flex:1;min-height:0}
table.rec{width:100%;border-collapse:collapse}
table.rec th{position:sticky;top:0;background:var(--mint);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--teal2);padding:0 8px;height:24px;border-bottom:1px solid var(--line);z-index:1}
table.rec td{padding:0 8px;height:var(--rh);border-bottom:1px solid #e7eef0;white-space:nowrap}
table.rec tr.sel td{background:#f2fbfb}
table.rec tr:hover td{background:#f6fafa}
td.dt{font-weight:700}
td.dr{max-width:150px;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:12px}
.cell{display:flex;align-items:center;gap:4px}
.cell .btn{height:22px;padding:0 8px;font-size:12px}
.cell .btn.on{background:var(--gold);border-color:var(--gold);color:#3b2a00}
.na{color:var(--mut);font-size:11px;font-style:italic}
.ib{width:22px;height:22px;padding:0;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;font-size:12px;line-height:1;color:var(--teal2)}
.ib:hover{background:var(--mint)}
.dbtn{border:0;background:none;font-weight:700;color:inherit;cursor:pointer;padding:0 6px;height:22px}
.dbtn:hover{text-decoration:underline}
.ib.d{color:var(--warn)}
.ib.d:hover{background:#fbe9e3}
.empty{padding:18px;color:var(--mut);text-align:center}
/* detail */
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-bottom:1px solid var(--line);background:#fafdfd}
.meta div{padding:4px 10px;border-right:1px solid var(--line);min-width:0}
.meta div:last-child{border-right:0}
.meta span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.badge{display:inline-block;padding:0 7px;border-radius:9px;font-size:11px;font-weight:700;color:#fff;background:var(--teal)}
.badge.rep{background:#7a4fb0}
.meta b .badge{display:inline-block;color:#fff;font-size:11px;text-transform:none;letter-spacing:.3px}
.body{padding:10px 12px;overflow:auto;flex:1;min-height:0}
.doc{overflow-x:auto}
.doc h3{margin:0 0 4px;font-family:Georgia,serif;color:var(--teal2);font-size:15px}
.doc .sub{color:var(--mut);font-size:12px;margin-bottom:6px}
.doc .kv{display:grid;grid-template-columns:110px 1fr;gap:1px 8px;margin:6px 0;font-size:12.5px}
.doc .kv dt{color:var(--mut);margin:0}
.doc .kv dd{margin:0}
.doc table{width:100%;border-collapse:collapse;margin:6px 0;font-size:12.5px}
.doc th{background:var(--mint);text-align:left;padding:2px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--teal2);border:1px solid var(--line)}
.doc td{padding:2px 6px;border:1px solid var(--line);height:24px}
.doc td.f{font-weight:700;color:var(--warn);text-align:center;width:34px}
.doc h4{margin:8px 0 2px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--teal2)}
.doc ul{margin:2px 0 4px 18px;padding:0}
.doc .samp{margin-top:10px;padding-top:4px;border-top:1px dashed var(--line);color:var(--mut);font-size:11px;font-style:italic}
.fileview{width:100%;height:100%;min-height:380px;border:1px solid var(--line);background:#e8eeef}
.fileview.img{object-fit:contain;height:auto;max-width:100%}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,35,40,.6);z-index:50;display:grid;place-items:center;padding:10px}
.mb{background:#fff;border-radius:8px;width:min(420px,100%);max-height:94vh;overflow:auto;border-top:4px solid var(--gold);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.mb h3{margin:0;padding:8px 14px;font-size:14px;color:var(--teal2);border-bottom:1px solid var(--line)}
.mb .in{padding:10px 14px;display:grid;gap:8px}
.mb label{display:grid;gap:2px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.mb input,.mb select{height:28px;border:1px solid var(--line);border-radius:5px;padding:0 8px;text-transform:none;letter-spacing:0;color:var(--ink)}
.mb .ft{display:flex;gap:6px;justify-content:flex-end;padding:8px 14px;border-top:1px solid var(--line)}
.err{color:var(--warn);font-size:12px;min-height:14px}
/* print preview */
.pv{position:fixed;inset:0;background:#6b7d82;z-index:60;display:flex;flex-direction:column}
.pvbar{display:flex;gap:8px;align-items:center;padding:6px 14px;background:var(--teal2);color:#fff}
.pvbar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvwrap{flex:1;overflow:auto;padding:14px}
.sheet{background:#fff;max-width:800px;margin:0 auto;padding:22px 26px;min-height:60vh;box-shadow:0 2px 14px rgba(0,0,0,.35)}
.sheet .top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--teal);padding-bottom:6px;margin-bottom:8px}
.sheet .top b{font-family:Georgia,serif;color:var(--teal2);letter-spacing:1px;font-size:14px}
.sheet .pm .wide{grid-column:1/-1}
.sheet .pm{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 12px;border:1px solid var(--line);padding:6px 8px;margin-bottom:10px;font-size:12.5px}
.sheet .pm span{color:var(--mut);font-size:10px;text-transform:uppercase;display:block;letter-spacing:.5px}
.sheet .fileview{height:70vh}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);background:#222;color:#fff;padding:7px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){
 body{height:auto;min-height:100%}
 .hdr{grid-template-columns:1fr auto;grid-template-areas:"c l" "t t"}
 .credit{grid-area:c}.lock{grid-area:l}.hdr h1{grid-area:t}
 .main{grid-template-columns:1fr}
 .scroll{max-height:42vh}
 .body{min-height:50vh}
 .meta{grid-template-columns:1fr 1fr}
 .meta div:nth-child(2){border-right:0}
 .meta div:nth-child(-n+2){border-bottom:1px solid var(--line)}
 .sp{display:none}
}
@media print{
 @page{margin:12mm}
 body{background:#fff;display:block;height:auto}
 body.pvopen>*:not(#pv){display:none!important}
 body.pvopen #pv{position:static;background:#fff;display:block}
 .pvbar,.toast{display:none!important}
 .pvwrap{padding:0;overflow:visible}
 .sheet{box-shadow:none;max-width:none;padding:0;min-height:0}
}
</style>
</head>

<header class="hdr">

<div class="main">

</div>

<div id="pv" class="pv" hidden>
  <div class="pvbar"><b id="pvTitle">Print preview</b>
    <button id="pvPrint" class="btn g" type="button">Print / Save as PDF</button>

  <div class="pvwrap"><div class="sheet" id="sheet"></div></div>
</div>
<div id="ovRoot"></div>
<div id="toast" class="toast" role="status"></div>
<input type="file" id="restoreIn" accept=".json,application/json" hidden>
<input type="file" id="fileIn" accept=".pdf,.jpg,.jpeg,application/pdf,image/jpeg" hidden>

/* ============ FILE STORE (IndexedDB; in-memory fallback) ============ */
const Files = {
  db: null, mem: new Map(), persistent: false,
  open() {
    return new Promise((res) => {
      if (!window.indexedDB) return res();
      let rq; try { rq = indexedDB.open("mdpr-files", 1); } catch (e) { return res(); }
      rq.onupgradeneeded = () => rq.result.createObjectStore("blobs");
      rq.onsuccess = () => { Files.db = rq.result; Files.persistent = true; res(); };
      rq.onerror = () => res();
    });
  },
  _tx(mode, fn) { return new Promise((res, rej) => { const tx = Files.db.transaction("blobs", mode); const r = fn(tx.objectStore("blobs")); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); }); },
  put(key, blob) { if (!Files.db) { Files.mem.set(key, blob); return Promise.resolve(); } return Files._tx("readwrite", (s) => s.put(blob, key)); },
  get(key) { if (!Files.db) return Promise.resolve(Files.mem.get(key) || null); return Files._tx("readonly", (s) => s.get(key)).then((v) => v || null); },
  del(key) { if (!Files.db) { Files.mem.delete(key); return Promise.resolve(); } return Files._tx("readwrite", (s) => s.delete(key)).catch(() => {}); },
  clear() { Files.mem.clear(); if (!Files.db) return Promise.resolve(); return Files._tx("readwrite", (s) => s.clear()).catch(() => {}); }
};

function modal(title, fields, okLabel, onOk, extra) {
  const err = h("div", { class: "err" }), inputs = {};
  const inner = h("div", { class: "in" });
  fields.forEach((f) => {
    const inp = f.type === "select" ? h("select", null, f.options.map((o) => h("option", { value: o }, o || "\u2013")))
      : h("input", { type: f.type || "text", value: f.value == null ? "" : f.value, placeholder: f.ph || "", maxlength: f.max || 80, autocomplete: "off" });
    if (f.type === "select") inp.value = f.value || "";
    inputs[f.key] = inp; inner.append(h("label", null, f.label, inp));
  });
  if (extra) inner.append(extra);
  inner.append(err);
  const close = () => { root.remove(); };
  const ok = h("button", { class: "btn", type: "button", onclick: () => { const vals = {}; for (const k in inputs) vals[k] = inputs[k].value.trim(); const m = onOk(vals); if (m) err.textContent = m; else close(); } }, okLabel);
  const root = h("div", { class: "ov", onmousedown: (e) => { if (e.target === root) close(); } },
    h("div", { class: "mb", role: "dialog", "aria-modal": "true" }, h("h3", null, title), inner, h("div", { class: "ft" }, h("button", { class: "btn o", type: "button", onclick: close }, "Cancel"), ok)));
  root.addEventListener("keydown", (e) => { if (e.key === "Enter") ok.click(); if (e.key === "Escape") close(); });
  $("ovRoot").append(root);
  const first = root.querySelector("input,select"); if (first) first.focus();
}

/* ============ BACKUP / RESTORE ============ */
const blobToDataUrl = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function backup() {
  try {
    const files = {};
    for (const p of Store.patients) for (const d of p.dates) for (const t of ["rx", "rep"]) {
      const doc = d[t]; if (doc && doc.source === "upload") { const k = fileKey(p.id, d.id, t), b = await Files.get(k); if (b) files[k] = await blobToDataUrl(b); }
    }
    const out = JSON.stringify({ app: CONFIG.appName, version: 1, saved: new Date().toISOString(), patients: Store.patients, files });
    const a = h("a", { href: URL.createObjectURL(new Blob([out], { type: "application/json" })), download: "prescriptions-record-backup-" + new Date().toISOString().slice(0, 10) + ".json" });
    document.body.append(a); a.click(); a.remove(); toast("Backup downloaded.");
  } catch (e) { toast("Backup failed."); }
}
function restore(file) {
  const r = new FileReader();
  r.onload = async () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || data.app !== CONFIG.appName || !Array.isArray(data.patients)) throw new Error("bad");
      if (!confirm("Replace ALL current data with this backup (" + data.patients.length + " patients)?")) return;
      await Files.clear();
      for (const k in (data.files || {})) await Files.put(k, await (await fetch(data.files[k])).blob());
      Store.patients = data.patients; Store.save(); selectPatient(Store.patients[0] && Store.patients[0].id); toast("Backup restored.");
    } catch (e) { toast("This is not a valid backup file."); }
  };
  r.readAsText(file);
}

/* ============ PRINT PREVIEW ============ */
function openPreview() {
  const p = curPatient(), d = curDate(), doc = d && (S.type === "rx" ? d.rx : d.rep); if (!doc) return;
  const sheet = $("sheet"); sheet.textContent = "";
  const label = TYPES[S.type].label;
  sheet.append(h("div", { class: "top" }, h("b", null, "\u271A " + CONFIG.appName.toUpperCase()), h("span", { class: "na" }, label)),
    h("div", { class: "pm" }, h("div", null, h("span", null, "Patient"), p.name), h("div", null, h("span", null, "Age / Sex"), [p.age, p.gender].filter(Boolean).join(" / ") || "\u2013"), h("div", null, h("span", null, "Date"), fmtDate(d.date)), h("div", null, h("span", null, "Doctor"), d.doctor || "\u2013"), h("div", { class: "wide" }, h("span", null, "Document"), (doc.title.indexOf(label) === 0 ? doc.title : label + " \u2013 " + doc.title))));
  buildDocBody(doc, p.id, d.id, S.type, true).then((el) => sheet.append(el));
  $("pvTitle").textContent = "Print preview \u2013 " + p.name + " \u2013 " + fmtDate(d.date) + " \u2013 " + label;
  $("pv").hidden = false; document.body.classList.add("pvopen"); document.body.dataset.t = document.title;
  $("pv").dataset.pdf = doc.source === "upload" && doc.file.type === "pdf" ? "1" : "";
  $("pv").dataset.title = p.name + " - " + fmtDate(d.date, true) + " - " + label;
}
function closePreview() { $("pv").hidden = true; document.body.classList.remove("pvopen"); document.title = "MY DOCTOR PRESCRIPTIONS RECORD"; $("sheet").textContent = ""; }
function doPrint() {
  const pv = $("pv"); document.title = pv.dataset.title; // suggested file name when saving as PDF
  if (pv.dataset.pdf) {
    const fr = $("sheet").querySelector("iframe");
    try { fr.contentWindow.focus(); fr.contentWindow.print(); }
    catch (e) { const a = $("sheet").querySelector("a"); if (a) window.open(a.href, "_blank"); toast("The PDF opened in a new tab. Press Ctrl+P there to print or save it."); }
    return;
  }
  window.print();
}
window.addEventListener("afterprint", () => { if (!$("pv").hidden) document.title = "MY DOCTOR PRESCRIPTIONS RECORD"; });

/* ============ INIT ============ */
function init() {
  $("patient").addEventListener("change", (e) => selectPatient(e.target.value));
  $("lock").addEventListener("click", () => (S.admin ? lockAdmin() : unlockDialog()));
  $("exportBtn").addEventListener("click", openPreview);
  $("pvClose").addEventListener("click", closePreview);
  $("pvPrint").addEventListener("click", doPrint);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("pv").hidden && !$("ovRoot").children.length) closePreview(); });
  $("aAddP").addEventListener("click", () => patientForm(null));
  $("aEditP").addEventListener("click", () => patientForm(curPatient()));
  $("aDelP").addEventListener("click", removePatient);
  $("aAddD").addEventListener("click", () => dateForm(null));
  $("aReset").addEventListener("click", resetSamples);
  $("aBackup").addEventListener("click", backup);
  $("aRestore").addEventListener("click", () => { $("restoreIn").value = ""; $("restoreIn").click(); });
  $("restoreIn").addEventListener("change", function () { if (this.files[0]) restore(this.files[0]); });
  Files.open().then(() => {
    Store.load();
    if (!Files.persistent) toast("Browser file storage is unavailable: uploads will last only until this page is closed.");
    selectPatient(Store.patients[0] && Store.patients[0].id);
  });
}
init();
</script>
